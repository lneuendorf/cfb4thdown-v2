[project]
name = "cfb4thdown-backend"
version = "0.1.0"
description = "cfb4thdown data pipeline, models, and API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "uvicorn[standard]>=0.30",
    "xgboost>=2.1,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]
train = ["optuna>=4", "statsmodels>=0.14", "matplotlib>=3.9"]

[tool.uv]
package = false
default-groups = ["dev", "train"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["analysis", "app", "jobs", "modeling", "providers", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
